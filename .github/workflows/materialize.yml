name: Materialize Summit Rush

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project source
        shell: bash
        run: |
          set -euo pipefail
          echo 'Chunk sizes:'
          wc -c bootstrap/payload.*
          echo 'Chunk hashes:'
          sha256sum bootstrap/payload.*
          rm -rf .materialized
          mkdir .materialized
          cat bootstrap/payload.* > /tmp/summit.b64
          echo "Combined bytes: $(wc -c < /tmp/summit.b64)"
          base64 --decode /tmp/summit.b64 > /tmp/summit.tar.gz
          gzip -t /tmp/summit.tar.gz
          tar -xzf /tmp/summit.tar.gz -C .materialized
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name bootstrap ! -name .materialized -exec rm -rf {} +
          cp -a .materialized/. .
          rm -rf .materialized bootstrap
      - name: Commit project tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Summit Rush v1.7.3 for Vercel' || exit 0
          git push
