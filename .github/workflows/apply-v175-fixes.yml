name: Apply Summit Rush v1.7.5 fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v175-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch_v175_repo.py
      - name: Validate
        run: |
          node --check game.js
          node --check server.js
          python -m json.tool package.json >/dev/null
          grep -q 'game.js?v=1.7.5' index.html
          grep -q 'max-height: 360px' style.css
          grep -q 'effectiveCurve' game.js
          grep -q 'snapshotVelocity' game.js
      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/patch_v175_repo.py .github/workflows/apply-v175-fixes.yml
          git add -A
          git commit -m 'Fix Spa start and shared race pace'
          git push
