name: Package Summit Rush v1.7.8

on:
  push:
    paths:
      - '.github/workflows/package-v178.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release
        run: |
          node --check game.js
          node --check server.js
          node -e "const p=require('./package.json'); if(p.version!=='1.7.8') process.exit(1)"
      - name: Build ZIP
        run: |
          zip -r summit-rush-threejs-racing-game-v1.7.8-mobile-hd.zip . \
            -x '.git/*' '.github/workflows/package-v178.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: summit-rush-v1.7.8-mobile-hd
          path: summit-rush-threejs-racing-game-v1.7.8-mobile-hd.zip
          if-no-files-found: error
