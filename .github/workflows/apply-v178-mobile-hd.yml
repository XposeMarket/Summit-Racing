name: Apply Summit Rush v1.7.8 mobile HD

on:
  push:
    paths:
      - '.github/patch-v178.py'
      - '.github/workflows/apply-v178-mobile-hd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/patch-v178.py
      - name: Validate
        run: |
          node --check game.js
          node --check server.js
          grep -q 'game.js?v=1.7.8' index.html
          grep -q 'style.css?v=1.7.8' index.html
          grep -q 'mobileGraphicsHd' index.html
          grep -q 'mobileHd' game.js
          node -e "const p=require('./package.json'); if(p.version!=='1.7.8') process.exit(1)"
      - name: Commit clean update
        run: |
          git config user.name 'Summit Rush Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/patch-v178.py .github/workflows/apply-v178-mobile-hd.yml
          git add game.js style.css index.html package.json README.md
          git commit -m 'Add Mobile HD graphics mode'
          git push
