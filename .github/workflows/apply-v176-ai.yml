name: Apply Summit Rush v1.7.6 AI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-v176-ai.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AI racing-line and corner-speed patch
        run: python3 scripts/apply-v176.py
      - name: Validate game
        run: |
          node --check game.js
          node --check server.js
          node -e "const p=require('./package.json'); if(p.version!=='1.7.6') process.exit(1)"
          grep -q "aiLineOffset" game.js
          grep -q "Math.sqrt(this.aiLateralGrip" game.js
          grep -q "game.js?v=1.7.6" index.html
      - name: Commit published source
        run: |
          git config user.name "Summit Rush Bot"
          git config user.email "actions@github.com"
          rm -f scripts/apply-v176.py .github/workflows/apply-v176-ai.yml
          git add game.js index.html package.json README.md scripts .github/workflows
          git commit -m "Add dynamic AI racing lines and faster sweepers"
          git push
